    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const current = document.documentElement.getAttribute('data-theme');
            const icon = document.querySelector('.theme-toggle i, .theme-toggle svg');
            if (icon) {
                icon.outerHTML = current === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>'; if(typeof refreshIcons === 'function') refreshIcons();
            }
        }
        document.addEventListener('DOMContentLoaded', () => { updateThemeIcon(); fetch('/api/settings').then(r=>r.json()).then(d=>{ if(d.systemLogo) { const el = document.getElementById('boardSystemLogo'); if(el) { el.src = d.systemLogo; el.style.display = 'block'; } } }); });

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/');
        let campId = urlParams.get('id');
        if (!campId && pathParts[pathParts.length - 1] && pathParts[pathParts.length - 1] !== 'board.html') campId = pathParts[pathParts.length - 1];
        const board = document.getElementById('board');
        
        let previousScores = {};
        let previousRanks = {};
        
        // State and Splash Management
        let latestState = null;
        let isSplashing = false;
        let splashQueue = [];

        function formatNumber(num, lang) { return lang === 'fa' ? num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : num; }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // Analog Counter function
        function hexToRgba(hex, alpha=0.3) { let c=hex?hex.substring(1):"ffffff"; if(c.length===3) c=c.split("").map(x=>x+x).join(""); return `rgba(${parseInt(c.slice(0,2),16)}, ${parseInt(c.slice(2,4),16)}, ${parseInt(c.slice(4,6),16)}, ${alpha})`; }
        function animateValue(obj, start, end, duration, lang = 'fa') {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = formatNumber(Math.floor(progress * (end - start) + start), lang);
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerText = formatNumber(end, lang);
            };
            window.requestAnimationFrame(step);
        }

        function showBoardMessage(icon, html) {
            const m = document.getElementById('boardMessage');
            m.innerHTML = `<span class="empty-icon">${icon}</span>${html}`;
            m.style.display = 'block';
            board.style.display = 'none';
        }
        function hideBoardMessage() {
            document.getElementById('boardMessage').style.display = 'none';
            board.style.display = '';
        }

        // Fullscreen + keep the screen awake while the board is shown on a TV
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* not allowed */ }
        }
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });
        ['click', 'touchstart', 'keydown'].forEach(evt => window.addEventListener(evt, requestWakeLock, { once: true }));
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            requestWakeLock();
        }
        document.addEventListener('fullscreenchange', () => {
            const b = document.getElementById('fullscreenBtn');
            if (b) { b.innerHTML = document.fullscreenElement ? '<i data-lucide="minimize"></i>' : '<i data-lucide="maximize"></i>'; refreshIcons(); }
            setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
        });
        document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F' || e.key === 'ب') && !e.ctrlKey && !e.metaKey) toggleFullscreen(); });

        ConnectionStatus.mount({ staleAfter: 40000 });

        if (!campId || !/^[A-Za-z0-9_-]{1,64}$/.test(campId)) {
            ConnectionStatus.show(false);
            showBoardMessage('🔗', 'لینک تابلو نامعتبر است.<br><small>لینک صحیح را از اپراتور مسابقه دریافت کنید.</small>');
        } else {
        fetch('/api?action=info&id=' + campId).then(r => r.json()).then(d => {
            if (!d.success) {
                if (typeof evtSource !== 'undefined') evtSource.close();
                ConnectionStatus.show(false);
                showBoardMessage('🔍', 'مسابقه‌ای با این لینک پیدا نشد.<br><small>ممکن است حذف شده باشد یا لینک اشتباه باشد.</small>');
            }
        }).catch(() => {});

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const unlockAudio = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
        ['click', 'touchstart', 'keydown'].forEach(evt => window.addEventListener(evt, unlockAudio, { once: true }));
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // Hide the cursor and the on-screen controls while nobody touches the board.
        let mouseTimer;
        function wakeUi() {
            document.body.style.cursor = 'default';
            document.body.classList.remove('ui-idle');
            clearTimeout(mouseTimer);
            mouseTimer = setTimeout(() => {
                document.body.style.cursor = 'none';
                document.body.classList.add('ui-idle');
            }, 3000);
        }
        ['mousemove', 'touchstart', 'keydown'].forEach(evt => document.addEventListener(evt, wakeUi, { passive: true }));
        wakeUi();


// Replaced Heavy Polling with Lightweight SSE
const evtSource = new EventSource('/api?action=stream&id=' + campId);
evtSource.onmessage = function(e) {
    if (e.data === ':') return;
    ConnectionStatus.ok();
    latestState = JSON.parse(e.data);
    if (splashQueue.length === 0 && !isSplashing) {
        renderBoard(latestState);
    }
};
evtSource.onopen = function() { ConnectionStatus.ok(); };
evtSource.addEventListener('ping', function() { ConnectionStatus.ok(); });
evtSource.onerror = function() { ConnectionStatus.fail(); };
evtSource.addEventListener('deleted', function() {
    evtSource.close();
    ConnectionStatus.show(false);
    showBoardMessage('🗑️', 'این مسابقه حذف شده است.');
});

evtSource.addEventListener('splash', function(e) {
    const data = JSON.parse(e.data);
    splashQueue.push({
        teamId: data.teamId, 
        delta: data.delta, 
        teamName: data.teamName, 
        score: data.score, 
        logId: data.logId || ('log_' + Date.now()), 
        user: data.user,
        tag: data.tag || '',
        image: data.image || '',
        happyImage: data.happyImage || '',
        sadImage: data.sadImage || '',
        teamColor: data.teamColor || ''
    });
    if (!isSplashing) {
        runSplashQueue();
    }
});

        }

        // --- Audio & Visual Warning / Celebration Systems ---
        let activeAlarmOsc = null;
        let activeAlarmInterval = null;

        function startSirenAlarm() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                stopSirenAlarm();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                osc.start();
                
                let high = true;
                osc.frequency.setValueAtTime(750, audioCtx.currentTime);
                activeAlarmInterval = setInterval(() => {
                    if (!osc) return;
                    try {
                        high = !high;
                        const freq = high ? 880 : 620;
                        osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
                    } catch(e) {}
                }, 240);
                
                activeAlarmOsc = { osc, gain };
            } catch(e) {
                console.warn('Siren audio error:', e);
            }
        }

        function stopSirenAlarm() {
            if (activeAlarmInterval) {
                clearInterval(activeAlarmInterval);
                activeAlarmInterval = null;
            }
            if (activeAlarmOsc) {
                try {
                    activeAlarmOsc.gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    setTimeout(() => {
                        try { activeAlarmOsc.osc.stop(); } catch(e){}
                        activeAlarmOsc = null;
                    }, 100);
                } catch(e) {
                    activeAlarmOsc = null;
                }
            }
        }

        function playSuccessChime() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        try {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.45);
                        } catch(e){}
                    }, idx * 75);
                });
            } catch(e) {}
        }

        function triggerConfetti() {
            try {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 100,
                        origin: { y: 0.55 },
                        colors: ['#10B981', '#34D399', '#FBBF24', '#60A5FA', '#F472B6', '#F59E0B']
                    });
                    setTimeout(() => {
                        confetti({
                            particleCount: 55,
                            angle: 60,
                            spread: 65,
                            origin: { x: 0.05, y: 0.7 },
                            colors: ['#10B981', '#34D399', '#FBBF24', '#60A5FA']
                        });
                        confetti({
                            particleCount: 55,
                            angle: 120,
                            spread: 65,
                            origin: { x: 0.95, y: 0.7 },
                            colors: ['#10B981', '#34D399', '#FBBF24', '#60A5FA']
                        });
                    }, 220);
                } else {
                    launchFallbackConfetti();
                }
            } catch(e) {
                launchFallbackConfetti();
            }
        }

        function launchFallbackConfetti() {
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.inset = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '3000';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#10B981', '#34D399', '#FBBF24', '#60A5FA', '#F472B6', '#F59E0B'];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height * 0.45,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 1.2) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 12
                });
            }

            let start = Date.now();
            function draw() {
                if (Date.now() - start > 2400) {
                    canvas.remove();
                    return;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4;
                    p.rot += p.rotSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
                    ctx.restore();
                });
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        }

        async function runSplashQueue() {
            isSplashing = true; 
            const popup = document.querySelector('.splash-popup');
            const sirenOverlay = document.getElementById('sirenOverlay');

            const splashHeaderImg = document.getElementById('splashHeaderImg');
            const splashHeaderPlaceholder = document.getElementById('splashHeaderPlaceholder');
            const splashTeamName = document.getElementById('splashTeamName');
            
            const splashRefereeAvatarWrap = document.getElementById('splashRefereeAvatarWrap');
            const splashRefereeImg = document.getElementById('splashRefereeImg');
            const splashRefereePlaceholder = document.getElementById('splashRefereePlaceholder');
            const splashRefereeName = document.getElementById('splashRefereeName');
            const splashRefereeRole = document.getElementById('splashRefereeRole');

            const splashScoreValue = document.getElementById('splashScoreValue');
            const splashTagWrap = document.getElementById('splashTagWrap');

            while (splashQueue.length > 0) {
                let sp = splashQueue.shift();
                popup.id = 'splash-' + sp.logId;
                
                // Add blur before showing
                document.getElementById('board').classList.add('blurred-board');
                
                const isPositive = sp.delta > 0;
                const color = isPositive ? 'var(--success-color)' : 'var(--danger-color)';
                const sign = isPositive ? '+' : '-';
                const formattedDelta = formatNumber(Math.abs(sp.delta), latestState?.numLang || 'fa');
                
                // Determine photo: happy image for +, sad image for -, fallback to default team image
                const targetTeam = (latestState?.teams || []).find(t => t.id === sp.teamId);
                let teamPhoto = '';

                if (isPositive) {
                    if (sp.happyImage || targetTeam?.happyImage) {
                        teamPhoto = sp.happyImage || targetTeam?.happyImage;
                    } else if (sp.image || targetTeam?.image) {
                        teamPhoto = sp.image || targetTeam?.image;
                    }
                } else {
                    if (sp.sadImage || targetTeam?.sadImage) {
                        teamPhoto = sp.sadImage || targetTeam?.sadImage;
                    } else if (sp.image || targetTeam?.image) {
                        teamPhoto = sp.image || targetTeam?.image;
                    }
                }

                // 1. Header Banner & Subtle Fade
                if (teamPhoto) {
                    splashHeaderImg.src = teamPhoto;
                    splashHeaderImg.style.display = 'block';
                    splashHeaderPlaceholder.style.display = 'none';
                } else {
                    splashHeaderImg.style.display = 'none';
                    splashHeaderPlaceholder.style.display = 'flex';
                    const tCol = sp.teamColor || targetTeam?.color || '#3b82f6';
                    splashHeaderPlaceholder.style.background = `linear-gradient(135deg, ${hexToRgba(tCol, 0.55)} 0%, rgba(15, 23, 42, 0.95) 100%)`;
                }

                // 2. Team name MUCH LARGER right on the fade boundary
                if (splashTeamName) {
                    splashTeamName.textContent = sp.teamName || targetTeam?.name || 'تیم';
                }

                // 3. Referee profile (Right) & Score (Left)
                let uPic = '';
                let uName = 'داور مسابقه';
                let uRole = 'ثبت امتیاز';
                if (sp.user) {
                    uPic = sp.user.profilePic || sp.user.photo || sp.user.avatar || sp.user.image || '';
                    uName = (sp.user.firstName ? `${sp.user.firstName} ${sp.user.lastName || ''}`.trim() : sp.user.username) || 'داور';
                    uRole = sp.user.role === 'head_referee' ? 'سرداور' : (sp.user.role === 'referee' ? 'داور مسابقه' : (sp.user.role === 'admin' ? 'مدیر سیستم' : 'داور'));
                }

                if (uPic) {
                    splashRefereeImg.src = uPic;
                    splashRefereeImg.style.display = 'block';
                    splashRefereePlaceholder.style.display = 'none';
                } else {
                    splashRefereeImg.style.display = 'none';
                    splashRefereePlaceholder.style.display = 'flex';
                }
                if (splashRefereeAvatarWrap) {
                    splashRefereeAvatarWrap.style.borderColor = color;
                }
                if (splashRefereeName) splashRefereeName.textContent = uName;
                if (splashRefereeRole) splashRefereeRole.textContent = uRole;

                if (splashScoreValue) {
                    splashScoreValue.textContent = `${sign}${formattedDelta}`;
                    splashScoreValue.style.color = color;
                }

                if (splashTagWrap) {
                    if (sp.tag) {
                        splashTagWrap.style.display = 'block';
                        splashTagWrap.innerHTML = `<div class="splash-tag-badge" style="color: ${color};"><i data-lucide="tag" style="width: 15px; height: 15px;"></i> <span>${esc(sp.tag)}</span></div>`;
                    } else {
                        splashTagWrap.style.display = 'none';
                    }
                }

                if (typeof refreshIcons === 'function') refreshIcons();

                // 4. Trigger Confetti & Positive Aura or Emergency Siren Lights & Alarm
                if (isPositive) {
                    popup.classList.remove('negative-alarm');
                    popup.classList.add('positive-glow');
                    if (splashScoreValue) {
                        splashScoreValue.classList.remove('siren-score-negative');
                        splashScoreValue.classList.add('siren-score-positive');
                    }
                    if (sirenOverlay) sirenOverlay.style.display = 'none';
                    stopSirenAlarm();
                    triggerConfetti();
                    playSuccessChime();
                } else {
                    popup.classList.remove('positive-glow');
                    popup.classList.add('negative-alarm');
                    if (splashScoreValue) {
                        splashScoreValue.classList.remove('siren-score-positive');
                        splashScoreValue.classList.add('siren-score-negative');
                    }
                    if (sirenOverlay) sirenOverlay.style.display = 'block';
                    startSirenAlarm();
                }
                
                // Reset position for centered flexbox
                popup.style.position = 'relative';
                popup.style.top = ''; 
                popup.style.left = '';
                popup.style.transform = '';
                popup.classList.remove('fly');
                popup.classList.add('show');

                if (sp.isCancelled || sp.isStandaloneCancel) {
                    const stamp = document.createElement('div');
                    stamp.className = 'cancel-stamp';
                    stamp.innerText = 'لغو شد';
                    popup.appendChild(stamp);
                }
                
                // Wait 2.5 seconds
                await sleep(2500);
                
                // Stop alarm and siren effects before flying
                stopSirenAlarm();
                if (sirenOverlay) sirenOverlay.style.display = 'none';
                popup.classList.remove('negative-alarm');
                popup.classList.remove('positive-glow');
                if (splashScoreValue) {
                    splashScoreValue.classList.remove('siren-score-negative');
                    splashScoreValue.classList.remove('siren-score-positive');
                }

                // Remove blur immediately when it starts flying
                document.getElementById('board').classList.remove('blurred-board');
                
                // Fly to Team's row (specifically the score element)
                const teamRow = document.getElementById('team-' + sp.teamId);
                if (teamRow) {
                    const scoreEl = teamRow.querySelector('.score-val');
                    if (scoreEl) {
                        const rect = scoreEl.getBoundingClientRect();
                        const popupRect = popup.getBoundingClientRect();
                        popup.style.position = 'fixed';
                        popup.style.top = (popupRect.top + popupRect.height/2) + 'px';
                        popup.style.left = (popupRect.left + popupRect.width/2) + 'px';
                        
                        popup.offsetHeight;
                        
                        popup.style.top = (rect.top + rect.height/2) + 'px';
                        popup.style.left = (rect.left + rect.width/2) + 'px';
                    }
                    popup.classList.add('fly');
                    await sleep(400);
                }
                
                popup.classList.remove('show');
                popup.classList.remove('fly');
                
                if (latestState) {
                    let stateToRender = JSON.parse(JSON.stringify(latestState));
                    splashQueue.forEach(pendingSp => {
                        let team = stateToRender.teams.find(t => t.id === pendingSp.teamId);
                        if (team && !pendingSp.isStandaloneCancel) {
                            team.score -= pendingSp.delta;
                        } else if (team && pendingSp.isStandaloneCancel) {
                            team.score += pendingSp.delta;
                        }
                    });
                    renderBoard(stateToRender);
                }
                popup.id = 'splashPopup';
                const stamps = popup.querySelectorAll('.cancel-stamp');
                stamps.forEach(s => s.remove());
                
                await sleep(1000); 
            }
            isSplashing = false; 
            document.getElementById('board').classList.remove('blurred-board');
            stopSirenAlarm();
            if (sirenOverlay) sirenOverlay.style.display = 'none';
            popup.classList.remove('negative-alarm', 'positive-glow');
            if (splashScoreValue) {
                splashScoreValue.classList.remove('siren-score-negative', 'siren-score-positive');
            }
            if (latestState) renderBoard(latestState);
        }

        // Stage progress: closed (tiered) stages and the stage that is running now.
        function renderStageStrip(data) {
            const strip = document.getElementById('stageStrip');
            const stages = Array.isArray(data.stages) ? data.stages : [];
            if (!stages.length) { strip.style.display = 'none'; return; }
            const closed = data.closedStages || {};
            const active = data.activeStageId;
            const activeStage = stages.find(st => st.id === active);
            const chips = stages.map((st, i) => {
                const cls = st.id === active ? 'active' : (closed[st.id] ? 'done' : '');
                const mark = st.id === active ? '▶' : (closed[st.id] ? '✓' : formatNumber(i + 1, data.numLang || 'fa'));
                return `<span class="stage-chip ${cls}"><span class="stage-chip-mark">${mark}</span>${esc(st.name)}</span>`;
            }).join('');
            const label = activeStage ? `<span class="stage-now">مرحله در حال اجرا: <b>${esc(activeStage.name)}</b></span>` : '';
            const html = label + `<div class="stage-chips">${chips}</div>`;
            if (strip.dataset.html !== html) { strip.innerHTML = html; strip.dataset.html = html; }
            strip.style.display = '';
        }

        // Final results: short countdown, then a podium (ties share a step).
        let announcedAt = null;
        let countdownTimer = null;
        function handleAnnouncement(data) {
            const ov = document.getElementById('announceOverlay');
            const a = data.announcement;
            if (!a || !a.active) {
                ov.style.display = 'none';
                announcedAt = null;
                clearInterval(countdownTimer);
                return;
            }
            if (announcedAt === a.at) { renderPodium(data); return; }
            announcedAt = a.at;
            ov.style.display = 'flex';
            const cd = document.getElementById('announceCountdown');
            const podium = document.getElementById('announcePodium');
            const reveal = () => {
                cd.style.display = 'none';
                podium.style.display = 'flex';
                renderPodium(data);
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 220, spread: 120, origin: { y: 0.6 } });
                    setTimeout(() => confetti({ particleCount: 150, spread: 160, origin: { y: 0.4 } }), 700);
                }
                try { playSound('success'); } catch (e) { /* audio locked */ }
            };
            clearInterval(countdownTimer);
            // Boards opened later skip the countdown and show the podium straight away.
            if (Date.now() - a.at > 15000) { reveal(); return; }
            let n = 5;
            podium.style.display = 'none';
            cd.style.display = 'flex';
            cd.textContent = formatNumber(n, data.numLang || 'fa');
            countdownTimer = setInterval(() => {
                n--;
                if (n <= 0) { clearInterval(countdownTimer); reveal(); return; }
                cd.textContent = formatNumber(n, data.numLang || 'fa');
                cd.classList.remove('pulse'); void cd.offsetWidth; cd.classList.add('pulse');
            }, 1000);
        }

        function renderPodium(data) {
            const lang = data.numLang || 'fa';
            const teams = [...(data.teams || [])].sort((a, b) => b.score - a.score);
            const groups = [];
            teams.forEach((t, i) => {
                const rank = (i > 0 && t.score === teams[i - 1].score) ? groups[groups.length - 1].rank : i + 1;
                if (rank > 3) return;
                if (groups.length && groups[groups.length - 1].rank === rank) groups[groups.length - 1].teams.push(t);
                else groups.push({ rank, teams: [t] });
            });
            const order = [groups[1], groups[0], groups[2]].filter(Boolean); // 2nd, 1st, 3rd
            const html = order.map(g => `
                <div class="podium-step podium-rank-${g.rank}">
                    <div class="podium-medal">${document.getElementById('medal-' + g.rank).innerHTML}</div>
                    ${g.teams.map(t => `<div class="podium-team" style="border-color: ${safeColor(t.color, '#fff')}">${esc(t.name)}</div>`).join('')}
                    <div class="podium-score">${formatNumber(g.teams[0].score, lang)} امتیاز</div>
                    <div class="podium-block">${formatNumber(g.rank, lang)}</div>
                </div>`).join('');
            const steps = document.getElementById('announceSteps');
            if (steps.dataset.html !== html) { steps.innerHTML = html; steps.dataset.html = html; }
        }

        function renderBoard(data) {
            document.documentElement.dir = data.dir || 'rtl';
            // Update Header
            if (data.title || data.orgName) {
                const org = data.orgName ? data.orgName + ' - ' : '';
                const title = data.title || '';
                document.getElementById('campTitleText').innerText = title;
                document.title = (title || 'اسکوربورد');
            }
            const logoEl = document.getElementById('orgLogo');
            const bgLogoEl = document.getElementById('bgLogo');
            if (data.logo) {
                logoEl.src = data.logo;
                logoEl.style.display = 'block';
                if (bgLogoEl) {
                    bgLogoEl.style.webkitMaskImage = 'none';
                    bgLogoEl.style.maskImage = 'none';
                    bgLogoEl.style.backdropFilter = 'none';
                    bgLogoEl.style.webkitBackdropFilter = 'none';
                    bgLogoEl.style.boxShadow = 'none';
                    bgLogoEl.style.backgroundImage = 'url(' + JSON.stringify(safeUrl(data.logo)) + ')';
                    bgLogoEl.style.backgroundSize = 'contain';
                    bgLogoEl.style.backgroundRepeat = 'no-repeat';
                    bgLogoEl.style.backgroundPosition = 'center';
                    bgLogoEl.style.backgroundColor = 'transparent';
                    bgLogoEl.style.opacity = '0.15';
                    bgLogoEl.style.display = 'block';
                }
            } else {
                logoEl.style.display = 'none';
                if (bgLogoEl) {
                    bgLogoEl.style.display = 'none';
                }
            }

            renderStageStrip(data);
            handleAnnouncement(data);

            if (!data.teams || data.teams.length === 0) {
                showBoardMessage('⏳', 'هنوز تیمی برای این مسابقه تعریف نشده است.<br><small>به محض ثبت تیم‌ها، جدول اینجا نمایش داده می‌شود.</small>');
                return;
            }
            hideBoardMessage();

            const lang = data.numLang || 'fa';
            const sortedTeams = data.teams.sort((a, b) => b.score - a.score);
            // Standard competition ranking: equal scores share a rank (1, 1, 3 …).
            const ranks = {};
            sortedTeams.forEach((t, i) => {
                ranks[t.id] = (i > 0 && t.score === sortedTeams[i - 1].score) ? ranks[sortedTeams[i - 1].id] : i + 1;
            });
            // Medals only once a team actually has points.
            const hasMedal = t => ranks[t.id] <= 3 && t.score > 0;

            // Dynamic Sizing
            const narrow = window.innerWidth < 640;
            const headerHeight = document.getElementById('boardHeader').offsetHeight;
            const stripEl = document.getElementById('stageStrip');
            const stripHeight = stripEl && stripEl.style.display !== 'none' ? stripEl.offsetHeight + 10 : 0;
            const footerEl = document.querySelector('.asva-footer');
            const footerHeight = footerEl ? footerEl.offsetHeight + 40 : 40;
            const availableHeight = window.innerHeight - headerHeight - stripHeight - footerHeight - 60; // 60px padding
            const numTeams = sortedTeams.length;
            const useTwoColumns = numTeams > 12 && !narrow;
            const numRows = useTwoColumns ? Math.ceil(numTeams / 2) : numTeams;
            // Calculate best row height
            let ROW_HEIGHT = Math.max(narrow ? 52 : 30, Math.min(200, Math.floor(availableHeight / numRows)));
            const innerHeight = Math.max(10, ROW_HEIGHT - (ROW_HEIGHT > 40 ? 10 : 4)); // margin bottom
            const rowWidth = useTwoColumns ? board.clientWidth / 2 : board.clientWidth;
            // On phones, sizes follow the width so long names stay readable.
            const nameFont = Math.max(14, Math.min(ROW_HEIGHT * 0.35, rowWidth / 16));
            const scoreFont = Math.max(16, Math.min(ROW_HEIGHT * 0.45, rowWidth / 9));
            const paddingStart = narrow ? Math.max(30, Math.min(ROW_HEIGHT * 0.55, 44)) : Math.max(30, ROW_HEIGHT * (useTwoColumns ? 0.5 : 0.8));
            const medalW = Math.max(18, Math.min(ROW_HEIGHT * 0.5, paddingStart - 6));

            sortedTeams.forEach((team, index) => {
                const teamKey = team.id;
                let row = document.getElementById('team-' + teamKey);
                
                if (!row) {
                    row = document.createElement('div');
                    row.id = 'team-' + teamKey;
                    row.className = 'board-row';
                    row.innerHTML = `
                        <div class="team-row" style="position: relative; border-inline-start: 12px solid ${safeColor(team.color, '#fff')};">
                            <div class="rank-number" style="position: absolute; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s; font-weight: 800; color: var(--text-color);"></div>
                            <div class="name-container" style="display: flex; align-items: center; min-width: 0;">
                                <div class="team-color-indicator" style="border-radius: 50%; flex-shrink: 0;"></div>
                                <h2 class="team-name" style="margin: 0; min-width: 0;">${esc(team.name)}</h2>
                            </div>
                            <div class="score-wrap">
                                <span class="rank-change" aria-hidden="true"></span>
                                <h2 class="score-val" dir="ltr" style="margin: 0; font-variant-numeric: tabular-nums;">${formatNumber(team.score, lang)}</h2>
                            </div>
                        </div>
                    `;
                    board.appendChild(row);
                }
                
                // Update content and dynamic styling
                const tr = row.querySelector('.team-row');
                tr.style.height = innerHeight + 'px';
                tr.style.padding = Math.max(2, innerHeight * 0.1) + 'px ' + Math.max(5, innerHeight * 0.2) + 'px';
                tr.style.borderInlineStartColor = safeColor(team.color, '#fff');
                // Add 30% tint of team color to the background
                tr.style.backgroundColor = `${hexToRgba(safeColor(team.color, '#ffffff'), 0.45)}`;

                const indicator = row.querySelector('.team-color-indicator');
                indicator.style.background = safeColor(team.color, '#fff');
                indicator.style.boxShadow = `0 0 10px ${safeColor(team.color, '#fff')}`;
                
                // Scale indicator
                const indicatorSize = Math.max(10, Math.min(ROW_HEIGHT * 0.25, narrow ? 14 : 999));
                indicator.style.width = indicatorSize + 'px';
                indicator.style.height = indicatorSize + 'px';
                
                // Adjust border width
                const borderW = Math.max(4, Math.min(ROW_HEIGHT * 0.1, narrow ? 6 : 999));
                tr.style.borderInlineStartWidth = borderW + 'px';
                
                const nameContainer = tr.querySelector('.name-container');
                nameContainer.style.paddingInlineStart = paddingStart + 'px';
                nameContainer.style.gap = Math.max(5, Math.min(ROW_HEIGHT * 0.15, narrow ? 8 : 999)) + 'px';
                
                const nameEl = row.querySelector('.team-name');
                nameEl.innerText = team.name;
                nameEl.title = team.name;
                nameEl.style.fontSize = nameFont + 'px';
                nameEl.classList.toggle('team-name-wrap', narrow);

                const scoreEl = row.querySelector('.score-val');
                scoreEl.style.fontSize = scoreFont + 'px';
                
                // Analog Score Update
                const oldScore = previousScores[teamKey];
                if (oldScore !== undefined && oldScore !== team.score) {
                    animateValue(scoreEl, oldScore, team.score, 1000, lang);
                } else if (oldScore === undefined) {
                    scoreEl.innerText = formatNumber(team.score, lang);
                }
                previousScores[teamKey] = team.score;

                // Rank change arrow (shown for a few seconds after a team moves)
                const rank = ranks[teamKey];
                const prevRank = previousRanks[teamKey];
                const arrow = row.querySelector('.rank-change');
                if (prevRank !== undefined && prevRank !== rank) {
                    const up = rank < prevRank;
                    arrow.textContent = (up ? '▲ ' : '▼ ') + formatNumber(Math.abs(prevRank - rank), lang);
                    arrow.className = 'rank-change show ' + (up ? 'up' : 'down');
                    arrow.style.fontSize = Math.max(12, scoreFont * 0.38) + 'px';
                    clearTimeout(arrow._t);
                    arrow._t = setTimeout(() => { arrow.className = 'rank-change'; }, 8000);
                }
                previousRanks[teamKey] = rank;

                // FLIP Animation & Layout Logic
                if (useTwoColumns) {
                    const rowIdx = Math.floor(index / 2);
                    const colIdx = index % 2;
                    row.style.top = `${rowIdx * ROW_HEIGHT}px`;
                    
                    const isLastOdd = (index === numTeams - 1) && (numTeams % 2 !== 0);
                    if (isLastOdd) {
                        row.style.width = 'calc(50% - 10px)';
                        row.style.insetInlineStart = 'calc(25% + 5px)';
                    } else {
                        row.style.width = 'calc(50% - 10px)';
                        if (colIdx === 0) {
                            row.style.insetInlineStart = '0';
                        } else {
                            row.style.insetInlineStart = 'calc(50% + 10px)';
                        }
                    }
                } else {
                    row.style.width = '100%';
                    row.style.insetInlineStart = '0';
                    row.style.top = `${index * ROW_HEIGHT}px`;
                }

                // Rank slot: a medal for ranks 1-3 (shared on ties), otherwise the rank number.
                const rankEl = row.querySelector('.rank-number');
                rankEl.style.width = medalW + 'px';
                rankEl.style.height = medalW + 'px';
                rankEl.style.insetInlineStart = (borderW + (paddingStart - medalW) / 2) + 'px';
                rankEl.style.top = '50%';
                rankEl.style.transform = 'translateY(-50%)';
                const medalKey = hasMedal(team) ? 'medal-' + rank : 'rank-' + rank;
                if (rankEl.dataset.key !== medalKey) {
                    rankEl.dataset.key = medalKey;
                    if (hasMedal(team)) {
                        rankEl.innerHTML = document.getElementById('medal-' + rank).innerHTML;
                        rankEl.setAttribute('aria-label', 'رتبه ' + rank);
                        rankEl.classList.add('has-medal');
                    } else {
                        rankEl.textContent = formatNumber(rank, lang);
                        rankEl.classList.remove('has-medal');
                    }
                }
                rankEl.style.fontSize = (hasMedal(team) ? medalW : Math.max(12, Math.min(ROW_HEIGHT * 0.35, medalW))) + 'px';
                rankEl.style.opacity = hasMedal(team) ? '1' : '0.75';
            });

            board.style.height = `${numRows * ROW_HEIGHT}px`;
            
            // Cleanup deleted teams
            const existingIds = new Set(sortedTeams.map(t => 'team-' + t.id));
            Array.from(board.children).forEach(child => {
                if (child.id.startsWith('team-') && !existingIds.has(child.id)) {
                    child.style.opacity = '0';
                    setTimeout(() => child.remove(), 1000);
                }
            });
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (latestState) {
                    // Create a simulated state by subtracting the deltas of remaining splashes in the queue
                    let stateToRender = JSON.parse(JSON.stringify(latestState));
                    splashQueue.forEach(pendingSp => {
                        let team = stateToRender.teams.find(t => t.id === pendingSp.teamId);
                        if (team && !pendingSp.isStandaloneCancel) {
                            team.score -= pendingSp.delta;
                        } else if (team && pendingSp.isStandaloneCancel) {
                            // If it's a standalone cancel, it means the server has REMOVED the delta.
                            // To simulate the state *before* this cancel is processed, we must ADD the delta back.
                            team.score += pendingSp.delta;
                        }
                    });
                    renderBoard(stateToRender);
                }
            }, 300);
        });

    </script>

    
    

    
    <script>
        function refreshIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }
        document.addEventListener("DOMContentLoaded", refreshIcons);
    </script>
    
    <script src="tooltip.js"></script>
