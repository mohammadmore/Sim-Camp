<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <title>نتایج و تقدیرنامه‌ها</title>
    <script src="i18n.js" data-scope="public"></script>
    <script>window.SIMCAMP_PHP = true;</script>
    <script src="common.js"></script>
    <script src="features.js"></script>
    <style>
        @import url('vendor/vazirmatn/Vazirmatn-font-face.css');
        :root { --ink: #0f172a; --muted: #475569; --line: #cbd5e1; --accent: #1d4ed8; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Vazirmatn, Tahoma, sans-serif; color: var(--ink); background: #e2e8f0; }
        .toolbar {
            position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
            padding: 12px; background: #0f172a; color: #fff;
        }
        .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .toolbar select, .toolbar button { font-family: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: none; }
        .toolbar button { background: #facc15; color: #111827; font-weight: 800; cursor: pointer; }
        .page { width: 210mm; min-height: 297mm; margin: 16px auto; padding: 18mm 16mm; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
        .report-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 16px; }
        .report-head img { max-height: 70px; max-width: 140px; object-fit: contain; }
        h1 { margin: 0; font-size: 26px; }
        .muted { color: var(--muted); font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid var(--line); padding: 8px 6px; text-align: center; }
        th { background: #f1f5f9; }
        td.team { text-align: right; font-weight: 700; }
        .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-inline-end: 6px; vertical-align: middle; border: 1px solid rgba(0,0,0,0.2); }
        tr.r1 td { background: #fef9c3; } tr.r2 td { background: #f1f5f9; } tr.r3 td { background: #ffedd5; }
        .cert {
            width: 297mm; height: 210mm; margin: 16px auto; padding: 14mm; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            display: flex;
        }
        .cert-inner {
            flex: 1; min-width: 0; border: 6px double #a16207; border-radius: 10px; padding: 12mm; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6mm;
            background: radial-gradient(circle at center, #fffbeb, #fff);
        }
        .cert-inner img { max-height: 28mm; max-width: 60mm; object-fit: contain; }
        .cert-title { font-size: 44px; font-weight: 900; color: #a16207; margin: 0; }
        .cert-text { font-size: 20px; line-height: 2; max-width: 220mm; }
        .cert-team { font-size: 40px; font-weight: 900; margin: 0; }
        .cert-rank { font-size: 26px; font-weight: 800; color: var(--accent); }
        .cert-sign { display: flex; justify-content: space-around; gap: 8mm; width: 100%; margin-top: 10mm; font-size: 15px; color: var(--muted); }
        .cert-sign div { border-top: 1px solid var(--muted); padding-top: 4px; flex: 0 1 60mm; min-width: 0; }
        .empty { text-align: center; padding: 60px 16px; font-size: 18px; }
        .cert-inner.custom-bg { background-size: cover; background-position: center; }
        .div-title { margin: 18px 0 6px 0; font-size: 17px; }
        /* Subtitle parts: a bullet between them (a middle dot reads as a Persian zero). */
        .meta span + span::before { content: '•'; margin: 0 6px; opacity: 0.6; }
        /* Wide tables scroll sideways inside the sheet on small screens. */
        .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        td.team { min-width: 110px; overflow-wrap: anywhere; }
        /* Trend chart (features.js); this page does not load style.css. */
        .chart-wrap { margin-top: 14px; break-inside: avoid; page-break-inside: avoid; }
        .line-chart { width: 100%; height: auto; display: block; overflow: visible; color: var(--ink); }
        .chart-label { paint-order: stroke; stroke: rgba(255, 255, 255, 0.85); stroke-width: 3px; }
        .chart-empty { text-align: center; color: var(--muted); padding: 24px; }
        /* Print: A4 portrait for the table, A4 landscape for each certificate, with printer-safe margins. */
        @page { size: A4 portrait; margin: 12mm; }
        @page cert { size: A4 landscape; margin: 10mm; }
        .cert { page: cert; }
        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .page { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
            .cert { width: auto; height: 188mm; margin: 0; padding: 0; box-shadow: none; break-before: page; page-break-before: always; }
            .tbl-scroll { overflow: visible; }
            tr { break-inside: avoid; page-break-inside: avoid; }
            .div-title { break-after: avoid; page-break-after: avoid; }
            tr.r1 td, tr.r2 td, tr.r3 td, .cert-inner, .dot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        @media screen and (max-width: 1180px) {
            .cert { width: auto; height: auto; min-height: 0; margin: 16px; }
        }
        @media screen and (max-width: 860px) {
            .page, .cert { width: auto; min-height: 0; height: auto; margin: 10px; padding: 16px; }
            .cert-inner { padding: 20px 12px; gap: 12px; }
            .cert-title { font-size: 30px; } .cert-team { font-size: 28px; } .cert-rank { font-size: 20px; } .cert-text { font-size: 17px; }
            .cert-sign { margin-top: 16px; font-size: 13px; }
        }
        @media screen and (max-width: 520px) {
            .page, .cert { margin: 8px; padding: 12px; }
            h1 { font-size: 21px; }
            .report-head { flex-wrap: wrap; }
            table { font-size: 13px; }
            th, td { padding: 6px 4px; }
            th { min-width: 64px; font-size: 12px; }
            .cert-title { font-size: 26px; } .cert-team { font-size: 23px; }
            .toolbar { padding: 10px 8px; }
            .toolbar select { font-size: 16px; } /* iOS zooms into smaller fields */
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <label>تقدیرنامه برای:
            <select id="certScope" onchange="render()" aria-label="تقدیرنامه برای">
                <option value="3">سه رتبه برتر</option>
                <option value="all">همه تیم‌ها</option>
                <option value="none">بدون تقدیرنامه</option>
            </select>
        </label>
        <button type="button" onclick="window.print()">🖨️ چاپ / ذخیره PDF</button>
    </div>
    <main id="root"><div class="empty">در حال بارگذاری نتایج…</div></main>

    <script>
        const campId = new URLSearchParams(location.search).get('id');
        let state = null;
        const N = (n) => fmtNum(n, (state && state.numLang) || 'fa');
        const rankWord = r => ({ 1: 'اول', 2: 'دوم', 3: 'سوم', 4: 'چهارم', 5: 'پنجم', 6: 'ششم', 7: 'هفتم', 8: 'هشتم', 9: 'نهم', 10: 'دهم' }[r] || N(r));

        function stageValue(team, stage) {
            const v = team.stageScores ? team.stageScores[stage.id] : undefined;
            if (v === undefined || v === null || v === '') return '—';
            return v === '-' ? 'عدم اتمام' : N(v);
        }

        // One table per group when the camp uses groups.
        function divisionTables(all) {
            if (!Feat.on(state, 'divisions') || !(state.divisions || []).length) return '';
            return state.divisions.map(d => {
                const list = all.filter(t => t.division === d.id);
                if (!list.length) return '';
                const r = Feat.rankMap(list);
                // Group names are often typed as «گروه الف»; do not print «گروه گروه الف».
                const title = /^گروه/.test(String(d.name || '').trim()) ? esc(d.name) : `گروه ${esc(d.name)}`;
                return `<h3 class="div-title">${title}</h3><div class="tbl-scroll"><table><thead><tr><th>رتبه در گروه</th><th>تیم</th><th>امتیاز کل</th></tr></thead><tbody>${list.map(t =>
                    `<tr><td>${N(r[t.id])}</td><td class="team"><span class="dot" style="background:${safeColor(t.color, '#fff')}"></span>${esc(t.name)}</td><td><b>${N(t.score)}</b></td></tr>`).join('')}</tbody></table></div>`;
            }).join('');
        }

        function render() {
            const root = document.getElementById('root');
            if (!state) return;
            const teams = [...(state.teams || [])].sort((a, b) => b.score - a.score);
            if (!teams.length) { root.innerHTML = '<div class="empty">هنوز تیمی ثبت نشده است.</div>'; return; }
            const ranks = {};
            teams.forEach((t, i) => { ranks[t.id] = (i > 0 && t.score === teams[i - 1].score) ? ranks[teams[i - 1].id] : i + 1; });
            const stages = state.stages || [];
            const logo = state.logo ? `<img src="${esc(safeUrl(state.logo))}" alt="">` : '';
            const today = new Date().toLocaleDateString(I18N.locale, { year: 'numeric', month: 'long', day: 'numeric' });
            const logsSum = t => (t.scoreLogs || []).reduce((a, l) => a + (l.type !== 'cancelled' ? (parseFloat(l.value) || 0) : 0), 0);

            const table = `
                <section class="page">
                    <div class="report-head">
                        <div><h1>${esc(state.title || 'نتایج مسابقه')}</h1><div class="muted meta">${state.orgName ? `<span>${esc(state.orgName)}</span>` : ''}<span>${esc(today)}</span><span>${state.locked ? 'نتایج نهایی' : 'نتایج تا این لحظه'}</span></div></div>
                        ${logo}
                    </div>
                    <div class="tbl-scroll"><table>
                        <thead><tr><th>رتبه</th><th>تیم</th>${stages.map(st => `<th>${esc(st.name)}</th>`).join('')}<th>امتیاز لحظه‌ای</th><th>امتیاز کل</th></tr></thead>
                        <tbody>${teams.map(t => `
                            <tr class="r${ranks[t.id]}">
                                <td><b>${N(ranks[t.id])}</b></td>
                                <td class="team"><span class="dot" style="background: ${safeColor(t.color, '#fff')}"></span>${esc(t.name)}</td>
                                ${stages.map(st => `<td>${stageValue(t, st)}</td>`).join('')}
                                <td>${N(logsSum(t))}</td>
                                <td><b>${N(t.score)}</b></td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                    ${divisionTables(teams)}
                    ${Feat.shown(state, 'trendChart') && Feat.trendSeries(state).some(x => x.points.length >= 2) ? `<div class="chart-wrap"><h3 class="div-title">روند امتیاز</h3>${Feat.lineChart(Feat.trendSeries(state), { width: Math.min(900, Feat.chartWidth()), lang: state.numLang })}</div>` : ''}
                </section>`;

            const scope = document.getElementById('certScope').value;
            const certTeams = scope === 'none' ? [] : teams.filter(t => scope === 'all' || ranks[t.id] <= 3);
            // Certificate design from the advanced settings (heading, text with {team} {rank} {score} {title}, signer, colour, background).
            const cd = state.certificate || {};
            const certs = certTeams.map(t => {
                const body = cd.body ? esc(cd.body).replace(/\{team\}/g, esc(t.name)).replace(/\{rank\}/g, rankWord(ranks[t.id])).replace(/\{score\}/g, N(t.score)).replace(/\{title\}/g, esc(state.title || '')) : '';
                const color = cd.color ? safeColor(cd.color, '#a16207') : '';
                const bg = cd.background ? ` style="background-image: url(${esc(JSON.stringify(safeUrl(cd.background)))}); ${color ? 'border-color:' + color : ''}"` : (color ? ` style="border-color:${color}"` : '');
                return `
                <section class="cert"><div class="cert-inner ${cd.background ? 'custom-bg' : ''}"${bg}>
                    ${cd.showLogo === false ? '' : logo}
                    <p class="cert-title"${color ? ` style="color:${color}"` : ''}>${esc(cd.heading || 'تقدیرنامه')}</p>
                    ${body ? `<div class="cert-text">${body}</div><p class="cert-team">${esc(t.name)}</p>` : `
                    <div class="cert-text">بدین‌وسیله از تلاش ارزشمند اعضای</div>
                    <p class="cert-team">${esc(t.name)}</p>
                    <div class="cert-rank">کسب رتبه ${rankWord(ranks[t.id])} با ${N(t.score)} امتیاز</div>
                    <div class="cert-text">در «${esc(state.title || '')}»${state.orgName ? ' — ' + esc(state.orgName) : ''} قدردانی می‌شود.</div>`}
                    ${(t.members || []).length ? `<div class="muted">${esc(t.members.map(m => m.name).join('، '))}</div>` : ''}
                    <div class="muted">${esc(today)}</div>
                    <div class="cert-sign">${cd.signer ? `<div>${esc(cd.signer)}${cd.signerRole ? '<br>' + esc(cd.signerRole) : ''}</div>` : '<div>امضای برگزارکننده</div><div>امضای سرداور</div>'}</div>
                </div></section>`;
            }).join('');
            root.innerHTML = table + certs;
        }

        if (!campId || !/^[A-Za-z0-9_-]{1,64}$/.test(campId)) {
            document.getElementById('root').innerHTML = '<div class="empty">لینک نامعتبر است.</div>';
        } else {
            fetch('api.php?action=poll&id=' + campId)
                .then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(data => { state = data; I18N.campLang(data.uiLang, data); document.title = `نتایج ${data.title || ''}`; render(); })
                .catch(() => { document.getElementById('root').innerHTML = '<div class="empty">مسابقه پیدا نشد یا ارتباط با سرور برقرار نیست.</div>'; });
        }
    </script>
</body>
</html>
